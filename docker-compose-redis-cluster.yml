services:
  redis-7011:
    image: redis:7.2
    container_name: redis-7011
    ports:
      - "7011:7011"      # 필요하면 나머지도 노출 가능
      - "17011:17011"    # (선택) 버스 포트는 노출 필요 없음
    command: >
      redis-server --port 7011
                   --cluster-enabled yes
                   --cluster-config-file nodes.conf
                   --cluster-node-timeout 5000
                   --appendonly yes
                   --dir /data
                   --cluster-announce-ip host.docker.internal
                   --cluster-announce-port 7011
                   --cluster-announce-bus-port 17011
    volumes:
      - ./data/7011:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7011", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      redis-cluster:
        ipv4_address: 172.28.0.11
    restart: unless-stopped

  redis-7012:
