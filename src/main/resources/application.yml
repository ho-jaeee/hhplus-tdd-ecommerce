spring:
  application:
    name: hhplus
  profiles:
    active: local
  datasource:
    name: HangHaePlusDataSource
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 600000   # 10m
      max-lifetime: 1800000 # 30m (RDS 기본 커넥션 만료보다 짧게)
      connection-timeout: 30000
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    generate-ddl: false
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate.timezone.default_storage: NORMALIZE_UTC
      hibernate.jdbc.time_zone: UTC
      format_sql: true
      use_sql_comments: true

redisson:
  config: |
    singleServerConfig:
      address: "${spring.data.redis.url}"  
      connectionMinimumIdleSize: 8
      connectionPoolSize: 32
    threads: 8
    nettyThreads: 8

popular:
  outbox:
    sync:
      fixedDelayMillis: 5000 # Outbox 동기화 주기

  rank:
    weekly:
      fixedDelayMillis: 300000 # 7일 랭킹 캐시 주기 (5분 = 300000ms)

